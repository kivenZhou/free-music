name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            name: macos-aarch64
            arch_tag: aarch64
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            name: macos-x64
            arch_tag: x64
          - platform: windows-latest
            rust_target: ""
            args: --bundles nsis
            name: windows-x64
            arch_tag: windows_x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Collect packages
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCH="${{ matrix.arch_tag }}"
          mkdir -p dist-packages
          shopt -s nullglob globstar

          # Prefer target-specific dirs (cross-compile) then default release/
          bundle_roots=(
            src-tauri/target/*/release/bundle
            src-tauri/target/release/bundle
          )

          # Manual installers
          for root in "${bundle_roots[@]}"; do
            for f in "$root"/dmg/*.dmg; do
              cp "$f" "dist-packages/YinZhan_${VERSION}_macos_${ARCH}.dmg"
            done
            for f in "$root"/nsis/*.exe; do
              [[ "$f" == *.sig ]] && continue
              cp "$f" "dist-packages/YinZhan_${VERSION}_windows_x64-setup.exe"
            done
          done

          # Updater artifacts + signatures
          for root in "${bundle_roots[@]}"; do
            for f in "$root"/macos/*.app.tar.gz; do
              cp "$f" "dist-packages/YinZhan_${VERSION}_${ARCH}.app.tar.gz"
            done
            for f in "$root"/macos/*.app.tar.gz.sig; do
              cp "$f" "dist-packages/YinZhan_${VERSION}_${ARCH}.app.tar.gz.sig"
            done
            for f in "$root"/nsis/*.exe.sig; do
              cp "$f" "dist-packages/YinZhan_${VERSION}_windows_x64-setup.exe.sig"
            done
          done

          ls -lh dist-packages
          test -n "$(ls -A dist-packages)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yinzhan-${{ matrix.name }}
          path: dist-packages/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-files
          find artifacts -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' \
            -o -name '*.app.tar.gz' -o -name '*.sig' \
          \) -print -exec cp {} release-files/ \;

          # Build updater manifest for in-app updates
          if ls release-files/*.sig >/dev/null 2>&1; then
            node scripts/build-latest-json.mjs \
              --dir release-files \
              --version "$VERSION" \
              --tag "$TAG" \
              --repo "${{ github.repository }}"
          else
            echo "No .sig files — skip latest.json (set TAURI_SIGNING_PRIVATE_KEY secret)"
          fi

          ls -lh release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
